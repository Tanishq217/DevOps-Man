apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-init
  labels:
    app: lifecycle-test
spec:
  initContainers:
    - name: setup
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Init container running schema migrations / config check...'; sleep 8; echo 'Initialization complete.'"]
  containers:
    - name: app
      image: nginx:1.27
      ports:
        - containerPort: 80
