apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-multi-container
  labels:
    app: lifecycle-test
spec:
  containers:
    - name: app
      image: nginx:1.27
      ports:
        - containerPort: 80
    - name: sidecar
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"[$(date)] Sidecar log shipper running...\"; sleep 10; done"]
