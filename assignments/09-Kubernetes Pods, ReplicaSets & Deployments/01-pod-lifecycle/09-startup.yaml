apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-startup
  labels:
    app: lifecycle-test
spec:
  containers:
    - name: slow-app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Legacy application initializing...'; sleep 30; touch /tmp/started; echo 'Application ready!'; sleep 300"]
      startupProbe:
        exec:
          command: ["sh", "-c", "test -f /tmp/started"]
        periodSeconds: 5
        failureThreshold: 10
