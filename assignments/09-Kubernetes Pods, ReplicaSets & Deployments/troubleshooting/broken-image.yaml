# Intentionally broken deployment for rollout stall & rollback drill
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend-broken
  labels:
    app: yatri-backend
    version: "broken-v3"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
        version: "broken-v3"
    spec:
      containers:
        - name: backend
          image: yatri-backend:non-existent-tag-v999
          ports:
            - containerPort: 5000
