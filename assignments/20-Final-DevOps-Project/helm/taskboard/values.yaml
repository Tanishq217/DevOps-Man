# Global and Release Configurations
namespace: taskboard

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/tanishq217/taskboard-backend
    tag: latest
    pullPolicy: IfNotPresent
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/tanishq217/taskboard-frontend
    tag: latest
    pullPolicy: IfNotPresent
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

postgres:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
  database: taskboard
  username: taskboard
  password: taskboard_production_secret
  storage:
    size: 2Gi

ingress:
  enabled: true
  className: nginx
  host: taskboard.local

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

monitoring:
  serviceMonitor:
    enabled: false
    interval: 15s
    path: /metrics
