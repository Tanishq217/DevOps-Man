apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.fullname" . }}-secrets
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ default (printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" .Values.postgres.username .Values.postgres.password (include "taskboard.fullname" .) .Values.postgres.database) .Values.backend.databaseUrl | quote }}
