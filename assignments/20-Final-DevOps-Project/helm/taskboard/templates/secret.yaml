apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.fullname" . }}-secrets
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: "postgresql+psycopg://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ include "taskboard.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
