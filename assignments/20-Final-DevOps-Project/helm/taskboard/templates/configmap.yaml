apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskboard.fullname" . }}-config
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
data:
  APP_NAME: "TaskBoard Cloud API"
  ENVIRONMENT: {{ .Values.environment | default "production" | quote }}
  PORT: {{ .Values.backend.port | quote }}
  DB_HOST: "{{ include "taskboard.fullname" . }}-postgres"
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.database | quote }}
