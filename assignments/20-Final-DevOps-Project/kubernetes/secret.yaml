apiVersion: v1
kind: Secret
metadata:
  name: taskboard-secrets
  namespace: taskboard
  labels:
    app: taskboard
type: Opaque
stringData:
  POSTGRES_USER: "taskboard"
  POSTGRES_PASSWORD: "taskboard_production_secret"
  DATABASE_URL: "postgresql+psycopg://taskboard:taskboard_production_secret@taskboard-postgres:5432/taskboard"
