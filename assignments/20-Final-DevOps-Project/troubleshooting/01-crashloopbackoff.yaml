apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-broken-crashloop
  namespace: taskboard
  labels:
    app: taskboard-crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard-crashloop
  template:
    metadata:
      labels:
        app: taskboard-crashloop
    spec:
      containers:
        - name: backend
          image: python:3.12-slim
          # Intentionally bad startup command that immediately exits with code 1
          command: ["sh", "-c", "echo 'Booting backend...' && exit 1"]
