name: TaskBoard DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/taskboard-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/taskboard-frontend

jobs:
  # =========================================================================
  # STAGE 1: Unit Testing & Frontend Verification
  # =========================================================================
  test:
    name: 🧪 Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r application/backend/requirements.txt

      - name: Run backend unit tests with Pytest
        run: |
          pytest application/backend/tests -v --junitxml=pytest-results.xml

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify frontend build
        run: |
          cd application/frontend
          npm install
          npm run build

  # =========================================================================
  # STAGE 2: DevSecOps Security Gate (SAST, SCA, Secret Scanning)
  # =========================================================================
  security-gate:
    name: 🛡️ DevSecOps Security Scanning
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security scanning tools
        run: |
          pip install bandit pip-audit

      - name: Run SAST Scan (Bandit)
        run: |
          bandit -r application/backend/app -ll -f json -o bandit-report.json || true
          bandit -r application/backend/app -ll

      - name: Run SCA Dependency Vulnerability Scan (pip-audit)
        run: |
          pip-audit -r application/backend/requirements.txt || true

      - name: Run Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # =========================================================================
  # STAGE 3: Docker Build
  # =========================================================================
  docker-build:
    name: 🐳 Docker Container Build
    runs-on: ubuntu-latest
    needs: security-gate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.BACKEND_IMAGE }}:latest \
            application/backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.FRONTEND_IMAGE }}:latest \
            application/frontend

  # =========================================================================
  # STAGE 4: Container Vulnerability Scan (Trivy)
  # =========================================================================
  container-scan:
    name: 🔍 Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build images locally for scanning
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} application/backend
          docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} application/frontend

      - name: Scan backend container image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan frontend container image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # =========================================================================
  # STAGE 5: Push Images to GitHub Container Registry (GHCR)
  # =========================================================================
  push:
    name: 🚀 Push Images to GHCR
    runs-on: ubuntu-latest
    needs: container-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: application/backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: application/frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  # =========================================================================
  # STAGE 6: Kubernetes & Helm Automated Deployment
  # =========================================================================
  deploy:
    name: ☸️ Deploy to Kubernetes (Kind)
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create Kubernetes Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Create TaskBoard Namespace
        run: kubectl apply -f kubernetes/namespace.yaml

      - name: Deploy TaskBoard with Helm Chart
        run: |
          helm upgrade --install taskboard helm/taskboard \
            --namespace taskboard \
            --set backend.image.repository=${{ env.BACKEND_IMAGE }} \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.repository=${{ env.FRONTEND_IMAGE }} \
            --set frontend.image.tag=${{ github.sha }} \
            --wait --timeout 300s

      - name: Verify Pods and Services
        run: |
          kubectl get pods -n taskboard -o wide
          kubectl get svc -n taskboard
          kubectl get ingress -n taskboard
