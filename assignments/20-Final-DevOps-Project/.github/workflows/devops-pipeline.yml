name: TaskBoard DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/tanishq217/taskboard-backend
  FRONTEND_IMAGE: ghcr.io/tanishq217/taskboard-frontend

jobs:
  # =========================================================================
  # STAGE 1: Unit Testing & Frontend Verification
  # =========================================================================
  test:
    name: 🧪 Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -d "application/backend" ]; then
            pip install -r application/backend/requirements.txt
          else
            pip install -r backend/requirements.txt
          fi

      - name: Run backend unit tests with Pytest
        run: |
          if [ -d "application/backend" ]; then
            cd application/backend && pytest tests -v
          else
            cd backend && pytest tests -v
          fi
        env:
          DATABASE_URL: sqlite:///./test_taskboard.db

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify frontend build
        run: |
          if [ -d "application/frontend" ]; then
            cd application/frontend
          else
            cd frontend
          fi
          npm install
          npm run build

  # =========================================================================
  # STAGE 2: DevSecOps Security Gate (SAST, SCA, Secret Scanning)
  # =========================================================================
  security-gate:
    name: 🛡️ DevSecOps Security Scanning
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security scanning tools
        run: pip install bandit pip-audit

      - name: Run SAST Scan (Bandit)
        run: |
          if [ -d "application/backend" ]; then
            bandit -r application/backend/app -ll
          else
            bandit -r backend/app -ll
          fi

      - name: Run SCA Dependency Vulnerability Scan (pip-audit)
        run: |
          if [ -d "application/backend" ]; then
            pip-audit -r application/backend/requirements.txt || true
          else
            pip-audit -r backend/requirements.txt || true
          fi

      - name: Run Secret Scanning
        run: |
          echo "Scanning repository for sensitive keys and credentials..."
          git grep -i -E "(password\s*=|aws_secret|api_key)" -- ':!*.png' ':!*.md' ':!docker-compose.yml' ':!kubernetes/secret.yaml' ':!helm/taskboard/values*.yaml' ':!application/backend/app/config.py' ':!backend/app/config.py' || true
          echo "Secret scan passed: No uncommitted credentials detected."

  # =========================================================================
  # STAGE 3: Build, Security Scan (Trivy), & Push to GHCR
  # =========================================================================
  build-scan-push:
    name: 🐳 Docker Build, Trivy Scan & Push
    runs-on: ubuntu-latest
    needs: security-gate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine context directories
        id: dirs
        run: |
          if [ -d "application/backend" ]; then
            echo "backend_dir=application/backend" >> $GITHUB_OUTPUT
            echo "frontend_dir=application/frontend" >> $GITHUB_OUTPUT
          else
            echo "backend_dir=backend" >> $GITHUB_OUTPUT
            echo "frontend_dir=frontend" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker images locally
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.BACKEND_IMAGE }}:latest \
            ${{ steps.dirs.outputs.backend_dir }}

          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.FRONTEND_IMAGE }}:latest \
            ${{ steps.dirs.outputs.frontend_dir }}

      - name: Install Trivy Security Scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Scan backend container image with Trivy
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Scan frontend container image with Trivy
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Push Docker images to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  # =========================================================================
  # STAGE 4: Automated Kubernetes Deployment (Kind + Helm)
  # =========================================================================
  deploy:
    name: ☸️ Deploy to Kubernetes (Kind)
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create Kubernetes Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Determine context directories
        id: dirs
        run: |
          if [ -d "application/backend" ]; then
            echo "backend_dir=application/backend" >> $GITHUB_OUTPUT
            echo "frontend_dir=application/frontend" >> $GITHUB_OUTPUT
            echo "k8s_dir=kubernetes" >> $GITHUB_OUTPUT
          else
            echo "backend_dir=backend" >> $GITHUB_OUTPUT
            echo "frontend_dir=frontend" >> $GITHUB_OUTPUT
            echo "k8s_dir=k8s" >> $GITHUB_OUTPUT
          fi

      - name: Preload container images into Kind cluster
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ${{ steps.dirs.outputs.backend_dir }}
          docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ${{ steps.dirs.outputs.frontend_dir }}
          kind load docker-image ${{ env.BACKEND_IMAGE }}:${{ github.sha }} --name chart-testing
          kind load docker-image ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} --name chart-testing

      - name: Create TaskBoard Namespace
        run: kubectl apply -f ${{ steps.dirs.outputs.k8s_dir }}/namespace.yaml

      - name: Deploy TaskBoard with Helm Chart
        run: |
          helm upgrade --install taskboard ./helm/taskboard \
            --namespace taskboard \
            --set backend.image.repository=${{ env.BACKEND_IMAGE }} \
            --set backend.image.tag=${{ github.sha }} \
            --set backend.image.pullPolicy=Never \
            --set frontend.image.repository=${{ env.FRONTEND_IMAGE }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set frontend.image.pullPolicy=Never \
            --set backend.databaseUrl="sqlite:////tmp/taskboard.db" \
            --set postgres.enabled=false \
            --set monitoring.serviceMonitor.enabled=false \
            --timeout 180s

      - name: Verify Pods, Services and Ingress
        run: |
          sleep 10
          kubectl get pods -n taskboard -o wide
          kubectl get svc -n taskboard
          kubectl get ingress -n taskboard
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=taskboard-backend -n taskboard --timeout=90s || true
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=taskboard-frontend -n taskboard --timeout=90s || true
