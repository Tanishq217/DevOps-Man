services:
  postgres:
    image: postgres:16-alpine
    container_name: taskboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard_secure_password
    ports:
      - "5432:5432"
    volumes:
      - taskboard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskboard-net

  backend:
    build:
      context: ../application/backend
      dockerfile: Dockerfile
    container_name: taskboard-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://taskboard:taskboard_secure_password@postgres:5432/taskboard
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - taskboard-net

  frontend:
    build:
      context: ../application/frontend
      dockerfile: Dockerfile
    container_name: taskboard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - taskboard-net

volumes:
  taskboard-pgdata:

networks:
  taskboard-net:
    driver: bridge
