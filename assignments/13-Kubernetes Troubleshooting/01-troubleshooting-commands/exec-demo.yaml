apiVersion: v1
kind: Pod
metadata:
  name: exec-demo
  labels:
    app: exec-demo
spec:
  containers:
    - name: alpine-tool
      image: alpine:3.19
      command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
