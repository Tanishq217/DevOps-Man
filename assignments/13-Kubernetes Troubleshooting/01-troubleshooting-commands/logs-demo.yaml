apiVersion: v1
kind: Pod
metadata:
  name: logs-demo
  labels:
    app: logs-demo
spec:
  containers:
    - name: logger
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          count=1
          while true; do
            echo "$(date '+%Y-%m-%d %H:%M:%S') [INFO] Application worker heartbeat ping #$count"
            if [ $((count % 5)) -eq 0 ]; then
              echo "$(date '+%Y-%m-%d %H:%M:%S') [WARN] High memory buffer observed during cycle $count"
            fi
            count=$((count + 1))
            sleep 2
          done
