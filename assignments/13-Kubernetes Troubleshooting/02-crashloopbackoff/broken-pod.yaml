apiVersion: v1
kind: Pod
metadata:
  name: crashloop-demo
  labels:
    app: crashloop-demo
spec:
  containers:
    - name: payment-worker
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "[STARTUP] Initializing payment processing daemon..."
          sleep 2
          echo "[FATAL] ConfigurationError: DB_HOST environment variable not defined. Exiting with failure."
          exit 1
