apiVersion: v1
kind: Pod
metadata:
  name: liveness-demo
  labels:
    app: probe-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - "touch /tmp/healthy; sleep 20; rm -f /tmp/healthy; sleep 600"
      livenessProbe:
        exec:
          command:
            - test
            - -f
            - /tmp/healthy
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 2
